name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accetta licenze Android SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Recupera keystore
        run: mkdir -p keystore && echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/mapsicle.jks

      - name: Calcola versionCode e verifica che cresca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versionCode = major*1000000 + minor*1000 + patch (0.6.1 -> 6001). Contano
          # tutti e tre i componenti: la formula precedente ignorava il patch, quindi
          # v0.5.1 e' uscito con lo stesso versionCode di v0.5.0 (1005) e Android non
          # lo installava sopra. Ricominciamo da 4000/5000/6000: un buco nel numbering
          # non importa, conta solo che cresca sempre.
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"
          version_code=$(( major * 1000000 + minor * 1000 + patch ))

          # Se il versionCode non cresce, il pacchetto viene rifiutato come downgrade e
          # dopo la release non si puo' piu' rimediare. La release corrente non esiste
          # ancora qui: viene pubblicata dopo il build.
          previous="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"
          if [ -n "$previous" ] && [ "$previous" != "$GITHUB_REF_NAME" ]; then
            prev_version="${previous#v}"
            prev_major="${prev_version%%.*}"
            prev_rest="${prev_version#*.}"
            prev_minor="${prev_rest%%.*}"
            prev_patch="${prev_rest##*.}"
            previous_code=$(( prev_major * 1000000 + prev_minor * 1000 + prev_patch ))
            if [ "$version_code" -le "$previous_code" ]; then
              echo "::error::versionCode $version_code non supera $previous_code di $previous"
              exit 1
            fi
            echo "versionCode $previous_code ($previous) -> $version_code ($GITHUB_REF_NAME)"
          else
            echo "prima release: versionCode $version_code"
          fi
          echo "versionName=${version} versionCode=${version_code}"
          echo "version_code=$version_code" >> "$GITHUB_ENV"

      - name: Test e lint
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode="$version_code"
        env:
          KEYSTORE_PATH: keystore/mapsicle.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'asset si chiama mapsicle-v<tag>.apk. La sintassi "file#label" di gh
          # cambierebbe solo l'etichetta mostrata, non il nome scaricabile: il file
          # va rinominato davvero.
          apk="app/build/outputs/apk/release/mapsicle-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Mapsicle $GITHUB_REF_NAME" \
            --generate-notes
