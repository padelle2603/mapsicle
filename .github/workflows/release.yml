name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accetta licenze Android SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Recupera keystore
        run: mkdir -p keystore && echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/mapsicle.jks

      - name: Build release APK
        run: |
          # versionCode derivato dal tag (0.4.0 -> 1004) cosi' cresce da sola a ogni
          # release: installare sopra una versione precedente non viene rifiutato.
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          minor_and_rest="${version#*.}"
          minor="${minor_and_rest%%.*}"
          version_code=$(( 1000 * (major + 1) + minor ))
          echo "versionName=${version} versionCode=${version_code}"
          ./gradlew :app:assembleRelease \
            -PversionName="$version" \
            -PversionCode="$version_code"
        env:
          KEYSTORE_PATH: keystore/mapsicle.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
