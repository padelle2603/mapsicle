<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSM Viewer — test PC</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      --page-bg: #e8eaed;
      --surface: #fff;
      --surface-hover: #f6f8fa;
      --surface-accent: #eef4ff;
      --panel-border: #1f000000;
      --input-border: #33000000;
      --border-subtle: #eee;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --icon-primary: #5f6368;
      --accent: #1565c0;
      --accent-text: #0b4ea2;
      --on-accent: #fff;
      --mode-background: #eef1f3;
      --mode-active: #dcecff;
      --navigation-surface: #f3faf6;
      --navigation-border: #b7d7c5;
      --success: #188038;
      --danger: #b3261e;
      --focus: #7aaeff;
      background: var(--page-bg);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page-bg: #0b0b0c;
        --surface: #121214;
        --surface-hover: #1b1b1f;
        --surface-accent: #1e2938;
        --panel-border: #34363b;
        --input-border: #3a3c42;
        --border-subtle: #2a2c31;
        --text-primary: #f5f5f5;
        --text-secondary: #b8bbc0;
        --icon-primary: #fff;
        --accent: #8ab4f8;
        --accent-text: #a8c7fa;
        --on-accent: #0b0b0c;
        --mode-background: #1b1b1f;
        --mode-active: #26364d;
        --navigation-surface: #101a13;
        --navigation-border: #35513d;
        --success: #81c995;
        --danger: #f2b8b5;
        --focus: #8ab4f8;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }

    .panel {
      position: absolute;
      z-index: 2;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 4px 16px #00000024;
    }

    .route-panel {
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 680px;
      overflow: hidden;
    }

    .route-toggle {
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      gap: 12px;
      border-radius: 0;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--text-primary);
      text-align: left;
    }

    .route-toggle:hover,
    .route-toggle:focus-visible {
      background: var(--surface-hover);
    }

    .route-heading {
      display: grid;
      min-width: 0;
      flex: 1;
      gap: 2px;
    }

    #route-title {
      font-size: 16px;
      font-weight: 700;
    }

    #route-header-summary {
      overflow: hidden;
      color: var(--text-secondary);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-right: 2px solid var(--icon-primary);
      border-bottom: 2px solid var(--icon-primary);
      transform: translateY(-3px) rotate(45deg);
      transition: transform 160ms ease;
    }

    .route-toggle[aria-expanded="false"] .chevron {
      transform: translateY(2px) rotate(-135deg);
    }

    .panel-body {
      padding: 0 10px 10px;
    }

    [hidden] {
      display: none !important;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    .field + .field {
      margin-top: 8px;
    }

    label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    input,
    button {
      min-height: 44px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      width: 100%;
      border: 1px solid var(--input-border);
      padding: 0 12px;
      color: var(--text-primary);
    }

    .input-with-action {
      display: flex;
      gap: 6px;
    }

    .input-with-action input {
      min-width: 0;
      flex: 1;
    }

    .gps-button {
      width: 52px;
      flex: 0 0 52px;
      padding: 0;
      border: 1px solid var(--input-border);
      background: var(--surface);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    button {
      border: 0;
      padding: 0 14px;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    #accept-route {
      width: 100%;
      margin-top: 8px;
    }

    .navigation-card {
      border: 1px solid var(--navigation-border);
      border-radius: 10px;
      padding: 12px;
      background: var(--navigation-surface);
    }

    .navigation-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    #navigation-mode {
      color: var(--success);
      font-weight: 600;
    }

    #navigation-instruction {
      margin-top: 6px;
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 750;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    #navigation-distance {
      min-height: 20px;
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    #navigation-progress {
      display: block;
      width: 100%;
      height: 8px;
      margin-top: 8px;
      accent-color: var(--success);
    }

    #navigation-progress-text {
      margin-top: 5px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    #stop-navigation {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--danger);
      background: var(--surface);
      color: var(--danger);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .modes {
      display: flex;
      min-width: 0;
      flex: 1;
      gap: 4px;
    }

    .modes button {
      min-width: 0;
      flex: 1;
      padding: 0 8px;
      background: var(--mode-background);
      color: var(--text-secondary);
      font-size: 13px;
    }

    .modes button.active {
      background: var(--mode-active);
      color: var(--accent-text);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    #status,
    #summary {
      min-height: 18px;
      margin-top: 6px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    #summary {
      color: var(--text-primary);
      font-size: 14px;
    }

    #suggestions {
      display: grid;
      max-height: min(40vh, 320px);
      overflow-y: auto;
      margin-top: 6px;
    }

    #suggestions:empty {
      display: none;
    }

    .suggestion {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-top: 1px solid var(--border-subtle);
      border-radius: 0;
      background: var(--surface);
      color: var(--text-primary);
      text-align: left;
      white-space: normal;
    }

    .suggestion:hover,
    .suggestion:focus-visible {
      background: var(--surface-accent);
    }

    .maplibregl-ctrl-group,
    .maplibregl-ctrl-attrib {
      background: var(--surface) !important;
      color: var(--text-secondary);
    }

    .maplibregl-ctrl-group button {
      background: var(--surface);
    }

    .maplibregl-ctrl-group button:hover {
      background: var(--surface-hover);
    }

    .maplibregl-ctrl-group button + button {
      border-top-color: var(--border-subtle);
    }

    .maplibregl-ctrl-attrib a {
      color: var(--accent);
    }

    @media (prefers-color-scheme: dark) and (not (forced-colors: active)) {
      .maplibregl-ctrl button .maplibregl-ctrl-icon,
      .maplibregl-ctrl-attrib-button {
        filter: brightness(0) invert(1);
      }
    }

    a {
      color: var(--accent);
    }

    @media (max-width: 560px) {
      .route-panel {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      .modes {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .chevron {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Mappa OpenStreetMap"></div>

  <section class="panel route-panel" aria-label="Pianifica un percorso">
    <button id="route-toggle" class="route-toggle" type="button" aria-expanded="false" aria-controls="panel-body">
      <span class="route-heading">
        <strong id="route-title">Itinerario</strong>
        <span id="route-header-summary">Scegli partenza e destinazione</span>
      </span>
      <span class="chevron" aria-hidden="true"></span>
    </button>

    <div id="panel-body" class="panel-body" hidden>
      <div id="route-content">
        <div class="field">
          <label for="start">Da</label>
          <div class="input-with-action">
            <input id="start" type="search" placeholder="Da dove?" autocomplete="off">
            <button id="start-gps" class="gps-button" type="button" aria-label="Usa la mia posizione come partenza">GPS</button>
          </div>
        </div>
        <div class="field">
          <label for="destination">A</label>
          <input id="destination" type="search" placeholder="Dove vuoi andare?" autocomplete="off">
        </div>
        <div id="suggestions" role="listbox"></div>
        <div class="controls">
          <div class="modes" role="group" aria-label="Mezzo di trasporto">
            <button type="button" class="active" data-mode="walk">A piedi</button>
            <button type="button" data-mode="bike">Bici</button>
            <button type="button" data-mode="car">Auto</button>
          </div>
          <button id="calculate" type="button" disabled>Calcola</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="summary"></div>
        <button id="accept-route" type="button" disabled hidden>Accetta</button>
      </div>

      <div id="navigation-content" class="navigation-card" hidden>
        <div class="navigation-meta">
          <span>Guida</span>
          <span id="navigation-mode">GPS</span>
        </div>
        <div id="navigation-instruction" role="status" aria-live="polite">In attesa della posizione…</div>
        <div id="navigation-distance"></div>
        <progress id="navigation-progress" max="100" value="0">0%</progress>
        <div id="navigation-progress-text">Avanzamento: 0%</div>
        <button id="stop-navigation" type="button">Termina guida</button>
      </div>
    </div>
  </section>

  <script src="./pc-test.local.js"></script>
  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

    const mapTilerKey = window.MAPTILER_API_KEY
      || new URLSearchParams(window.location.search).get("maptilerKey")
      || window.localStorage.getItem("maptilerApiKey")
      || "";
    if (mapTilerKey) {
      window.localStorage.setItem("maptilerApiKey", mapTilerKey);
    }
    const mapStyleUrl = mapTilerKey
      ? `https://api.maptiler.com/maps/streets-v4/style.json?key=${encodeURIComponent(mapTilerKey)}`
      : "https://tiles.openfreemap.org/styles/liberty";

    const map = new maplibregl.Map({
      container: "map",
      style: mapStyleUrl,
      center: [12.5, 42.5],
      zoom: 5,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl(), "bottom-left");
    map.addControl(new maplibregl.GeolocateControl({
      position: "bottom-right",
      trackUserLocation: true,
      showUserHeading: true
    }));
    map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-left");

    const routeToggle = document.querySelector("#route-toggle");
    const panelBody = document.querySelector("#panel-body");
    const routeHeaderSummary = document.querySelector("#route-header-summary");
    const routeContent = document.querySelector("#route-content");
    const navigationContent = document.querySelector("#navigation-content");
    const startInput = document.querySelector("#start");
    const startGps = document.querySelector("#start-gps");
    const destinationInput = document.querySelector("#destination");
    const suggestions = document.querySelector("#suggestions");
    const status = document.querySelector("#status");
    const summary = document.querySelector("#summary");
    const calculate = document.querySelector("#calculate");
    const acceptRoute = document.querySelector("#accept-route");
    const stopNavigation = document.querySelector("#stop-navigation");
    const navigationMode = document.querySelector("#navigation-mode");
    const navigationInstruction = document.querySelector("#navigation-instruction");
    const navigationDistance = document.querySelector("#navigation-distance");
    const navigationProgress = document.querySelector("#navigation-progress");
    const navigationProgressText = document.querySelector("#navigation-progress-text");
    const modeButtons = [...document.querySelectorAll("[data-mode]")];
    const state = {
      activeField: startInput,
      start: null,
      destination: null,
      mode: "walk",
      places: [],
      version: 0,
      timer: null,
      controller: null,
      lastRequest: 0,
      route: null,
      guidance: false,
      arrived: false,
      simulationTimer: null,
      simulationIndex: 0,
      locationWatch: null
    };
    let startMarker;
    let destinationMarker;
    let currentLocationMarker;

    const setStatus = (text) => {
      status.textContent = text;
    };

    if (!mapTilerKey) {
      setStatus("MapTiler non configurato: uso la mappa fallback. Aggiungi ?maptilerKey=...");
    }

    const setPanelCollapsed = (collapsed) => {
      routeToggle.setAttribute("aria-expanded", String(!collapsed));
      panelBody.hidden = collapsed;
    };

    const updateHeaderSummary = () => {
      routeHeaderSummary.textContent = state.guidance
        ? "Guida attiva"
        : state.route?.summary || "Scegli partenza e destinazione";
    };

    const clearSuggestions = () => {
      state.version += 1;
      if (state.timer) window.clearTimeout(state.timer);
      state.timer = null;
      state.controller?.abort();
      state.controller = null;
      state.places = [];
      suggestions.replaceChildren();
    };

    const placeLabel = (feature) => {
      const properties = feature.properties || {};
      return ["name", "street", "locality", "city", "state", "country"]
        .map((key) => properties[key])
        .filter(Boolean)
        .filter((value, index, values) => values.indexOf(value) === index)
        .join(", ");
    };

    const updateCalculate = () => {
      calculate.disabled = !(state.start && state.destination);
    };

    const showSuggestions = (places) => {
      suggestions.replaceChildren();
      state.places = places;
      if (places.length === 0) {
        setStatus("Nessun suggerimento");
        return;
      }
      setStatus("");
      places.forEach((place) => {
        const button = document.createElement("button");
        button.className = "suggestion";
        button.type = "button";
        button.textContent = place.label;
        button.addEventListener("click", () => selectSuggestion(place));
        suggestions.append(button);
      });
    };

    const selectSuggestion = (place) => {
      if (state.activeField === startInput) {
        state.start = place;
        startInput.value = place.label;
      } else {
        state.destination = place;
        destinationInput.value = place.label;
      }
      clearSuggestions();
      updateCalculate();
      updateMarkers();
      map.flyTo({ center: [place.lon, place.lat], zoom: 13 });
    };

    const requestSuggestions = async (field, query, version) => {
      if (state.activeField !== field || version !== state.version) return;
      const wait = 1100 - (Date.now() - state.lastRequest);
      if (wait > 0) {
        state.timer = window.setTimeout(() => requestSuggestions(field, query, version), wait);
        return;
      }
      state.controller?.abort();
      const controller = new AbortController();
      state.controller = controller;
      state.lastRequest = Date.now();
      setStatus("Ricerca suggerimenti…");
      try {
        const url = new URL("https://photon.komoot.io/api/");
        url.searchParams.set("q", query);
        url.searchParams.set("limit", "5");
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const places = (data.features || [])
          .filter((feature) => feature.geometry?.type === "Point")
          .map((feature) => ({
            label: placeLabel(feature),
            lat: feature.geometry.coordinates[1],
            lon: feature.geometry.coordinates[0]
          }))
          .filter((place) => place.label);
        if (version === state.version && state.activeField === field) {
          showSuggestions(places);
        }
      } catch (error) {
        if (error.name !== "AbortError" && version === state.version) {
          setStatus("Suggerimenti non disponibili");
        }
      } finally {
        if (state.controller === controller) {
          state.controller = null;
        }
      }
    };

    const scheduleSuggestions = (field) => {
      state.activeField = field;
      state.version += 1;
      if (state.timer) window.clearTimeout(state.timer);
      state.controller?.abort();
      const query = field.value.trim();
      if (query.length < 3) {
        clearSuggestions();
        return;
      }
      const version = state.version;
      state.timer = window.setTimeout(() => requestSuggestions(field, query, version), 300);
    };

    const updateMarkers = () => {
      startMarker?.remove();
      destinationMarker?.remove();
      startMarker = state.start
        ? new maplibregl.Marker({ color: "#188038" })
            .setLngLat([state.start.lon, state.start.lat])
            .setPopup(new maplibregl.Popup().setText("Partenza"))
            .addTo(map)
        : null;
      destinationMarker = state.destination
        ? new maplibregl.Marker({ color: "#c5221f" })
            .setLngLat([state.destination.lon, state.destination.lat])
            .setPopup(new maplibregl.Popup().setText("Destinazione"))
            .addTo(map)
        : null;
    };

    const setStartLocation = (coordinates) => {
      if (state.guidance) return;
      setPanelCollapsed(false);
      invalidateRoute();
      state.start = { label: "La mia posizione", lon: coordinates[0], lat: coordinates[1] };
      startInput.value = state.start.label;
      setStatus("Posizione GPS impostata come partenza");
      updateCalculate();
      updateMarkers();
      map.flyTo({ center: coordinates, zoom: 14 });
    };

    const requestStartLocation = () => {
      setPanelCollapsed(false);
      if (!navigator.geolocation) {
        setStatus("Posizione GPS non disponibile");
        return;
      }
      setStatus("Ricerca posizione GPS…");
      navigator.geolocation.getCurrentPosition((position) => {
        setStartLocation([position.coords.longitude, position.coords.latitude]);
      }, () => {
        setStatus("Posizione GPS non disponibile");
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10_000 });
    };

    const formatDistance = (meters) => meters >= 1000
      ? `${(meters / 1000).toFixed(1).replace(".", ",")} km`
      : `${Math.round(meters)} m`;

    const formatDuration = (seconds) => {
      const minutes = Math.max(1, Math.round(seconds / 60));
      const hours = Math.floor(minutes / 60);
      return hours > 0 ? `${hours} h ${String(minutes % 60).padStart(2, "0")} min` : `${minutes} min`;
    };

    const instructionFor = (command) => ({
      1: "Continua",
      2: "Svolta a sinistra",
      3: "Svolta leggermente a sinistra",
      4: "Svolta nettamente a sinistra",
      5: "Svolta a destra",
      6: "Svolta leggermente a destra",
      7: "Svolta nettamente a destra",
      8: "Mantieni sinistra",
      9: "Mantieni destra",
      10: "Inversione a U a sinistra",
      11: "Inversione a U a destra",
      12: "Sei fuori rotta",
      13: "Alla rotonda",
      14: "Alla rotonda, mantieni sinistra",
      15: "Inversione a U",
      16: "Continua",
      17: "Esci a sinistra",
      18: "Esci a destra"
    })[command] || "Continua sul percorso";

    const distanceMeters = (first, second) => {
      const latitudeScale = 111_320;
      const longitudeScale = latitudeScale * Math.cos((first[1] + second[1]) * Math.PI / 360);
      return Math.hypot(
        (second[0] - first[0]) * longitudeScale,
        (second[1] - first[1]) * latitudeScale
      );
    };

    const bearingBetween = (first, second) => {
      const firstLatitude = first[1] * Math.PI / 180;
      const secondLatitude = second[1] * Math.PI / 180;
      const deltaLongitude = (second[0] - first[0]) * Math.PI / 180;
      const y = Math.sin(deltaLongitude) * Math.cos(secondLatitude);
      const x = Math.cos(firstLatitude) * Math.sin(secondLatitude)
        - Math.sin(firstLatitude) * Math.cos(secondLatitude) * Math.cos(deltaLongitude);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    };

    const createRoute = (coordinates, properties) => {
      const cumulative = [0];
      for (let index = 1; index < coordinates.length; index += 1) {
        cumulative.push(cumulative[index - 1] + distanceMeters(coordinates[index - 1], coordinates[index]));
      }
      const geometryDistance = cumulative[cumulative.length - 1];
      const steps = (properties.voicehints || [])
        .filter((hint) => Number.isInteger(hint[0]) && hint[0] >= 0 && hint[0] < coordinates.length)
        .sort((first, second) => first[0] - second[0]);
      return {
        coordinates,
        cumulative,
        steps,
        totalDistance: Math.max(Number(properties["track-length"]) || 0, geometryDistance),
        summary: `${formatDistance(Number(properties["track-length"]))} · ${formatDuration(Number(properties["total-time"]))}`
      };
    };

    const calculateRouteProgress = (route, coordinate) => {
      const referenceLatitude = coordinate[1];
      const longitudeScale = 111_320 * Math.cos(referenceLatitude * Math.PI / 180);
      const project = (point) => [point[0] * longitudeScale, point[1] * 111_320];
      const current = project(coordinate);
      let bestSegment = 0;
      let bestRatio = 0;
      let bestDistance = Number.POSITIVE_INFINITY;

      for (let index = 0; index < route.coordinates.length - 1; index += 1) {
        const start = project(route.coordinates[index]);
        const end = project(route.coordinates[index + 1]);
        const deltaX = end[0] - start[0];
        const deltaY = end[1] - start[1];
        const lengthSquared = deltaX * deltaX + deltaY * deltaY;
        const ratio = lengthSquared === 0 ? 0 : Math.max(0, Math.min(1,
          ((current[0] - start[0]) * deltaX + (current[1] - start[1]) * deltaY) / lengthSquared
        ));
        const projected = [start[0] + deltaX * ratio, start[1] + deltaY * ratio];
        const distance = Math.hypot(current[0] - projected[0], current[1] - projected[1]);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestSegment = index;
          bestRatio = ratio;
        }
      }

      const segmentLength = distanceMeters(route.coordinates[bestSegment], route.coordinates[bestSegment + 1]);
      const traveled = Math.max(0, route.cumulative[bestSegment] + segmentLength * bestRatio);
      const nextStep = route.steps.find((step) => route.cumulative[step[0]] > traveled + 5) || null;
      const remaining = Math.max(0, route.totalDistance - traveled);
      const distanceToNext = nextStep
        ? Math.max(0, route.cumulative[nextStep[0]] - traveled)
        : remaining;
      const destinationDistance = distanceMeters(coordinate, route.coordinates[route.coordinates.length - 1]);
      return {
        nextStep,
        remaining,
        distanceToNext,
        percent: route.totalDistance > 0 ? Math.max(0, Math.min(100, Math.round(traveled / route.totalDistance * 100))) : 0,
        arrived: destinationDistance <= 25 || (bestDistance <= 50 && remaining <= 25)
      };
    };

    const addRoute = (route, geoJson) => {
      const add = () => {
        if (state.route !== route) return;
        if (map.getSource("route")) {
          map.getSource("route").setData(geoJson);
        } else {
          map.addSource("route", { type: "geojson", data: geoJson });
          map.addLayer({
            id: "route-line",
            type: "line",
            source: "route",
            paint: { "line-color": "#1565c0", "line-width": 6 }
          });
        }
        const bounds = route.coordinates.reduce((result, coordinate) => result.extend(coordinate), new maplibregl.LngLatBounds(route.coordinates[0], route.coordinates[0]));
        map.fitBounds(bounds, { padding: 56 });
      };
      if (map.isStyleLoaded()) add();
      else map.once("load", add);
    };

    const clearRouteLayer = () => {
      const source = map.getSource("route");
      if (source) {
        source.setData({ type: "FeatureCollection", features: [] });
      }
    };

    const clearGuidanceTracking = () => {
      if (state.simulationTimer) window.clearInterval(state.simulationTimer);
      state.simulationTimer = null;
      if (state.locationWatch !== null) {
        navigator.geolocation?.clearWatch(state.locationWatch);
        state.locationWatch = null;
      }
    };

    const updateGuidancePosition = (route, coordinate) => {
      if (state.route !== route || !state.guidance) return;
      currentLocationMarker?.remove();
      currentLocationMarker = new maplibregl.Marker({ color: "#1a73e8" })
        .setLngLat(coordinate)
        .addTo(map);
      const progress = calculateRouteProgress(route, coordinate);
      if (progress.arrived) {
        finishGuidance();
        return;
      }

      const nextStep = progress.nextStep;
      navigationInstruction.textContent = nextStep
        ? instructionFor(nextStep[1])
        : "Continua verso la destinazione";
      navigationDistance.textContent = nextStep
        ? `Prossima svolta tra ${formatDistance(progress.distanceToNext)}`
        : `Destinazione tra ${formatDistance(progress.remaining)}`;
      navigationProgress.value = progress.percent;
      navigationProgress.textContent = `${progress.percent}%`;
      navigationProgressText.textContent = `Avanzamento: ${progress.percent}%`;
      const target = nextStep ? route.coordinates[nextStep[0]] : route.coordinates[route.coordinates.length - 1];
      map.easeTo({
        center: coordinate,
        zoom: 16,
        bearing: bearingBetween(coordinate, target),
        duration: 500
      });
    };

    const finishGuidance = () => {
      clearGuidanceTracking();
      state.guidance = false;
      state.arrived = true;
      navigationMode.textContent = "Arrivo";
      navigationInstruction.textContent = "Sei arrivato";
      navigationDistance.textContent = "";
      navigationProgress.value = 100;
      navigationProgress.textContent = "100%";
      navigationProgressText.textContent = "Avanzamento: 100%";
      stopNavigation.textContent = "Chiudi guida";
      updateHeaderSummary();
    };

    const startSimulation = (route) => {
      clearGuidanceTracking();
      navigationMode.textContent = "Demo GPS";
      state.simulationIndex = 0;
      const advance = () => {
        if (state.route !== route || !state.guidance) return;
        const coordinate = route.coordinates[state.simulationIndex];
        updateGuidancePosition(route, coordinate);
        if (state.arrived) return;
        if (state.simulationIndex >= route.coordinates.length - 1) {
          finishGuidance();
        } else {
          state.simulationIndex += 1;
        }
      };
      state.simulationTimer = window.setInterval(advance, 650);
      advance();
    };

    const beginGuidance = (route, simulation) => {
      if (!route || state.guidance) return;
      clearGuidanceTracking();
      state.guidance = true;
      state.arrived = false;
      routeContent.hidden = true;
      navigationContent.hidden = false;
      acceptRoute.hidden = true;
      stopNavigation.hidden = false;
      stopNavigation.textContent = "Termina guida";
      navigationMode.textContent = simulation ? "Demo GPS" : "GPS";
      navigationInstruction.textContent = "In attesa della posizione…";
      navigationDistance.textContent = "";
      navigationProgress.value = 0;
      navigationProgress.textContent = "0%";
      navigationProgressText.textContent = "Avanzamento: 0%";
      currentLocationMarker?.remove();
      currentLocationMarker = null;
      setPanelCollapsed(false);
      setStatus("");
      updateHeaderSummary();
      if (simulation) startSimulation(route);
    };

    const stopGuidance = () => {
      clearGuidanceTracking();
      state.guidance = false;
      state.arrived = false;
      currentLocationMarker?.remove();
      currentLocationMarker = null;
      routeContent.hidden = false;
      navigationContent.hidden = true;
      acceptRoute.hidden = false;
      stopNavigation.hidden = true;
      stopNavigation.textContent = "Termina guida";
      updateHeaderSummary();
    };

    const requestGuidance = () => {
      const route = state.route;
      if (!route || state.guidance) return;
      setPanelCollapsed(false);
      if (!navigator.geolocation) {
        beginGuidance(route, true);
        return;
      }

      setStatus("Richiesta posizione…");
      navigator.geolocation.getCurrentPosition((position) => {
        if (state.route !== route || state.guidance) return;
        beginGuidance(route, false);
        const coordinate = [position.coords.longitude, position.coords.latitude];
        updateGuidancePosition(route, coordinate);
        if (state.arrived) return;
        state.locationWatch = navigator.geolocation.watchPosition((update) => {
          updateGuidancePosition(route, [update.coords.longitude, update.coords.latitude]);
        }, () => {
          state.locationWatch = null;
          if (state.route === route && state.guidance && !state.arrived) {
            startSimulation(route);
          }
        }, { enableHighAccuracy: true, maximumAge: 1_000, timeout: 15_000 });
      }, () => {
        if (state.route !== route || state.guidance) return;
        beginGuidance(route, true);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10_000 });
    };

    const invalidateRoute = () => {
      stopGuidance();
      state.route = null;
      acceptRoute.disabled = true;
      acceptRoute.hidden = true;
      summary.textContent = "";
      clearRouteLayer();
      updateHeaderSummary();
    };

    const calculateRoute = async () => {
      const start = state.start;
      const destination = state.destination;
      if (!start || !destination) return;
      const requestedMode = state.mode;
      const profiles = { walk: "shortest", bike: "trekking", car: "car-fast" };
      const points = `${start.lon},${start.lat}|${destination.lon},${destination.lat}`;
      stopGuidance();
      state.route = null;
      acceptRoute.disabled = true;
      acceptRoute.hidden = true;
      summary.textContent = "";
      updateHeaderSummary();
      calculate.disabled = true;
      setStatus("Calcolo percorso…");
      try {
        const url = new URL("https://brouter.de/brouter");
        url.searchParams.set("lonlats", points);
        url.searchParams.set("profile", profiles[requestedMode]);
        url.searchParams.set("format", "geojson");
        url.searchParams.set("alternativeidx", "0");
        url.searchParams.set("timode", "3");
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const feature = data.features?.[0];
        const coordinates = feature?.geometry?.coordinates;
        if (!coordinates || coordinates.length < 2) throw new Error("route");
        if (state.start !== start || state.destination !== destination || state.mode !== requestedMode) return;
        const route = createRoute(coordinates, feature.properties || {});
        const geoJson = {
          type: "FeatureCollection",
          features: [{
            type: "Feature",
            properties: {},
            geometry: { type: "LineString", coordinates }
          }]
        };
        state.route = route;
        addRoute(route, geoJson);
        summary.textContent = route.summary;
        acceptRoute.disabled = false;
        acceptRoute.hidden = false;
        setStatus("");
        updateHeaderSummary();
      } catch (error) {
        if (state.start === start && state.destination === destination && state.mode === requestedMode) {
          setStatus("Percorso non disponibile");
        }
      } finally {
        calculate.disabled = !(state.start && state.destination);
      }
    };

    [startInput, destinationInput].forEach((field) => {
      field.addEventListener("focus", () => {
        state.activeField = field;
      });
      field.addEventListener("input", () => {
        invalidateRoute();
        if (field === startInput) {
          state.start = null;
          startMarker?.remove();
          startMarker = null;
        } else {
          state.destination = null;
          destinationMarker?.remove();
          destinationMarker = null;
        }
        updateCalculate();
        scheduleSuggestions(field);
      });
      field.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && state.places.length > 0) {
          selectSuggestion(state.places[0]);
        }
      });
    });

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (state.mode === button.dataset.mode) return;
        state.mode = button.dataset.mode;
        modeButtons.forEach((item) => item.classList.toggle("active", item === button));
        invalidateRoute();
      });
    });

    routeToggle.addEventListener("click", () => {
      setPanelCollapsed(routeToggle.getAttribute("aria-expanded") === "true");
    });
    calculate.addEventListener("click", calculateRoute);
    startGps.addEventListener("click", requestStartLocation);
    acceptRoute.addEventListener("click", requestGuidance);
    stopNavigation.addEventListener("click", stopGuidance);
    map.on("geolocate", (event) => {
      const coordinates = event.features?.[0]?.geometry?.coordinates;
      if (coordinates) setStartLocation(coordinates);
    });
  </script>
</body>
</html>
